name: Bug report
description: Something isn't working correctly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Spec (SPEC.md)
        - Excel converter (tools/excel_to_fmd.py)
        - Example file
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Paste the smallest FMD snippet or command that triggers the issue.
      render: markdown
